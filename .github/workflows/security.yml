name: Preview sandbox security checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Ensure generated HTML cannot claim app origin
        run: node --test tests/sandbox-security.test.mjs
      - name: Type-check preview and messaging
        run: npx tsc --noEmit
